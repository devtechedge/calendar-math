[project]
name = "calendar-math"
version = "0.1.0"
description = "Single-turn calendar arithmetic (date offset, day count, weekday) with a deterministic datetime grader."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "devtechedge" }]
keywords = [
    "rl",
    "rlvr",
    "calendar",
    "math",
    "verifiable",
    "single-turn",
    "datetime",
]
dependencies = [
    "verifiers>=0.1.14",
    "datasets",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["calendar_math.py"]
